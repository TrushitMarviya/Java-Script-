<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  />
</head>
<body>
  <div class="app">
    <div class="card">

      <!-- Search -->
      <div class="search-box">
        <input type="text" id="input" placeholder="Enter city name..." />
        <button id="btn"><i class="fas fa-search"></i></button>
      </div>

      <!-- Icon -->
      <div class="icon-box">
        <img
          src="https://cdn.weatherapi.com/weather/64x64/day/116.png"
          id="img1"
          alt="Weather"
        />
      </div>

      <!-- Temperature -->
      <div class="temp-box">
        <h1 id="h1">--°C</h1>
        <p id="name">City Name</p>
      </div>

      <!-- Details -->
      <div class="details">
        <div class="detail-card">
          <i class="fa-solid fa-wind"></i>
          <div>
            <span id="wind">-- km/h</span>
            <p>Wind Speed</p>
          </div>
        </div>

        <div class="detail-card">
          <i class="fa-solid fa-droplet"></i>
          <div>
            <span id="humadity">--%</span>
            <p>Humidity</p>
          </div>
        </div>
      </div>

      <p class="error" id="error">City not found</p>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
