<script>

    let arr = ["Apple" , "Banana" , "Chery" ,"Dragon Fruit" , "Elichi" , "Fig" ,"Guava"]
    console.log(arr);
    
    arr.push("Hardy Kivi")
    console.log("After Pushing : "+  arr);

    arr.pop()
    console.log("After Popping : "+  arr);

    let ans = arr.slice(0,10)
    console.log("After Slicing : " + ans);
    
    arr.splice(1 , 1 , "Bery")
    console.log("After Splicing : " + arr);

    arr.shift()
    console.log(" After Shifting : " + arr);

    arr.unshift("Almond")
    console.log(" After Unshifting : " + arr);
    
    arr.sort()
    console.log("After Sorting : " + arr);

    arr.reverse()
    console.log("After Reversing : " + arr);

    
</script>
